# One-click deploy: https://render.com/deploy?repo=https://github.com/leadxmedia/leadxmedia
services:
  - type: web
    name: leadxmedia
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    # copies launched from the Deploy button should not redeploy on every push to this repo
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: leadxmedia-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: SEED_DEMO
        value: "false"
databases:
  - name: leadxmedia-db
    plan: basic-256mb
    postgresMajorVersion: "16"
